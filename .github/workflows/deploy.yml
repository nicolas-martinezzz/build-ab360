name: Deploy to Production

on:
  push:
    branches: [main]

# Server details come from repository variables, not from this file:
#   vars.DEPLOY_HOST     hostname or IP of the production server
#   vars.DEPLOY_PORT     SSH port
#   vars.DEPLOY_USER     SSH user
#   vars.DEPLOY_WEBROOT  remote webroot path
# The private key stays in secrets.SERVER_SSH_KEY.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_WEBROOT: ${{ vars.DEPLOY_WEBROOT }}
        run: |
          set -euo pipefail

          for var in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_WEBROOT; do
            if [ -z "${!var}" ]; then
              echo "Missing repository variable: $var" >&2
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          # Static build. --delete removes remote files no longer in out/,
          # so api/ is excluded here and synced separately below.
          rsync -avz --delete \
            -e "$SSH_CMD" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='api' \
            out/ "$TARGET:$DEPLOY_WEBROOT/"

          rsync -avz \
            -e "$SSH_CMD" \
            public/api/ "$TARGET:$DEPLOY_WEBROOT/api/"
